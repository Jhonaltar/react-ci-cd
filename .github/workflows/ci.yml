
name: CI - React

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  ci:
    name: Validar proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar ESLint
        run: npm run lint

      - name: Compilar proyecto
        run: npm run build

      - name: Ejecutar pruebas Vitest
        run: npm run test

      - name: Ejecutar pruebas Jest
        run: npm run test:jest
      
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E con Playwright
        run: npm run test:e2e

      - name: Guardar evidencias de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidencias
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      
      - name: Ejecutar pruebas E2E con Cypress
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          install: false

      - name: Guardar evidencias de Cypress
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-evidencias
          path: |
            cypress/screenshots/
            cypress/videos/
          retention-days: 7
          if-no-files-found: ignore


