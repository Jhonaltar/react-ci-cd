
name: CI - React

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  ci:
    name: Validar proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar ESLint
        run: npm run lint

      - name: Compilar proyecto
        run: npm run build

      - name: Ejecutar pruebas Vitest
        run: npm run test

      - name: Ejecutar pruebas Jest
        run: npm run test:jest
